<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Slide Widget</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent !important;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .widget {
      position: fixed;
      bottom: 10px;
      right: 10px;
      height: 28px;
      min-width: 220px;
      overflow: hidden;
      background: transparent !important;
    }

    .text {
      position: absolute;
      width: 100%;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      line-height: 28px;
      white-space: nowrap;
      transform: translateY(100%);
      opacity: 0;
      transition: transform 0.55s ease, opacity 0.55s ease;
      background: transparent !important;
    }

    .current {
      transform: translateY(0%);
      opacity: 1;
    }

    .next {
      transform: translateY(100%);
      opacity: 0;
    }

    .up {
      transform: translateY(-100%);
      opacity: 0;
    }
  </style>
</head>
<body>
  <div class="widget">
    <div id="line1" class="text current">Ataa Team Week</div>
    <div id="line2" class="text next"></div>
  </div>

  <script>
    const teams = [
      { name: "Ataa Team Week", color: "#f39c12" },
      { name: "Zeinab Team Week", color: "#5dade2" },
      { name: "Shaimaa Team Week", color: "#76d7c4" },
      { name: "Esraa Team Week", color: "#bb8fce" },
      { name: "Hana Team Week", color: "#ec7063" }
    ];

    let index = 0;

    const line1 = document.getElementById("line1");
    const line2 = document.getElementById("line2");

    line1.style.color = teams[0].color;

    function rotateLine() {
      index = (index + 1) % teams.length;

      line2.textContent = teams[index].name;
      line2.style.color = teams[index].color;
      line2.className = "text next";

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          line1.className = "text up";
          line2.className = "text current";
        });
      });

      setTimeout(() => {
        line1.textContent = line2.textContent;
        line1.style.color = line2.style.color;
        line1.className = "text current";
        line2.className = "text next";
      }, 600);
    }

    setInterval(rotateLine, 20000);
  </script>
</body>
</html>
