<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Widget</title>

<style>
body {
  margin: 0;
  background: transparent;
  font-family: Arial, sans-serif;
}

/* SMALL FLOATING BOX */
.widget {
  position: fixed;
  bottom: 10px;
  right: 10px;
  padding: 12px 18px;
  border-radius: 12px;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  box-shadow: 0 8px 20px rgba(0,0,0,0.25);
  min-width: 180px;
  text-align: center;
  transition: all 0.4s ease;
  opacity: 1;
}

/* SMOOTH TRANSITION */
.fade {
  opacity: 0;
}
</style>
</head>

<body>

<div class="widget" id="widget">
  اسبوع القوة(روز )
</div>

<script>
// TEAM DATA
const teams = [
  { name: "اسبوع القوة(روز )", color: "#f39c12" },
  { name: "اسبوع التحدي(جوري )", color: "#5dade2" },
  { name: "اسبوع الطاقه والانجاز (ياسمين قروب )", color: "#76d7c4" },
  { name: "اسبوع تحطيم الارقام 💪🏽(اوركيد قروب )", color: "#bb8fce" },
  { name: "أسبوع انجز وارتاح (لافندر)", color: "#ec7063" }
];

let index = 0;
const widget = document.getElementById("widget");

// INITIAL
widget.style.background = teams[0].color;

// CONTINUOUS LOOP (NO DELAY)
setInterval(() => {
  widget.classList.add("fade");

  setTimeout(() => {
    index = (index + 1) % teams.length;

    widget.textContent = teams[index].name;
    widget.style.background = teams[index].color;

    widget.classList.remove("fade");
  }, 200);

}, 30000); // 30 seconds
</script>

</body>
</html>
