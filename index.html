<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Widget</title>

<style>
body {
  margin: 0;
  background: transparent;
  font-family: Arial, sans-serif;
}

/* CONTAINER */
.widget {
  position: fixed;
  bottom: 10px;
  right: 10px;
  height: 30px;
  overflow: hidden;
  min-width: 200px;
}

/* TEXT STYLE */
.text {
  position: absolute;
  width: 100%;
  text-align: center;
  font-size: 15px;
  font-weight: bold;
  transition: transform 0.5s ease, opacity 0.5s ease;
}

/* ANIMATION STATES */
.current {
  transform: translateY(0);
  opacity: 1;
}

.next {
  transform: translateY(100%);
  opacity: 0;
}

.slide-up {
  transform: translateY(-100%);
  opacity: 0;
}
</style>
</head>

<body>

<div class="widget">
  <div id="text1" class="text current">أسبوع القوة (روز)</div>
  <div id="text2" class="text next"></div>
</div>

<script>
const teams = [
  { name: "أسبوع القوة (روز)", color: "#f39c12" },
  { name: "اسبوع التحدي(جوري)", color: "#5dade2" },
  { name: "اسبوع الطاقه والانجاز (ياسمين)", color: "#76d7c4" },
  { name: "اسبوع تحطيم الارقام 💪🏽(اوركيد)", color: "#bb8fce" },
  { name: "أسبوع انجز وارتاح (لافندر)", color: "#ec7063" }
];

let index = 0;

const text1 = document.getElementById("text1");
const text2 = document.getElementById("text2");

// INITIAL COLOR
text1.style.color = teams[0].color;

// LOOP EVERY 30 SECONDS
setInterval(() => {

  index = (index + 1) % teams.length;

  // Prepare next text
  text2.textContent = teams[index].name;
  text2.style.color = teams[index].color;

  // Reset position
  text2.className = "text next";

  // Trigger animation
  setTimeout(() => {
    text1.className = "text slide-up";
    text2.className = "text current";
  }, 50);

  // Swap after animation
  setTimeout(() => {
    text1.textContent = text2.textContent;
    text1.style.color = text2.style.color;

    text1.className = "text current";
    text2.className = "text next";
  }, 500);

}, 30000); // 30 seconds
</script>

</body>
</html>
