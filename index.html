<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Rotation Popup</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
}

/* POPUP */
.popup {
  position: fixed;
  bottom: 20px;
  right: 20px;
  padding: 25px 30px;
  border-radius: 16px;
  color: #fff;
  font-size: 20px;
  font-weight: bold;
  box-shadow: 0 15px 35px rgba(0,0,0,0.3);
  transition: all 0.5s ease;
  min-width: 280px;
  text-align: center;
}
</style>

</head>

<body>

<div class="popup" id="popup">
  Ataa Team Week
</div>

<script>
const data = [
  { text: "Ataa Team Week", color: "#f39c12" },     // Orange
  { text: "Zeinab Team Week", color: "#5dade2" },   // Sky Blue
  { text: "Shaimaa Team Week", color: "#76d7c4" },  // Light Blue
  { text: "Esraa Team Week", color: "#bb8fce" },    // Light Purple
  { text: "Hana Team Week", color: "#ec7063" }      // Rose
];

let index = 0;
const popup = document.getElementById("popup");

// INITIAL COLOR
popup.style.background = data[0].color;

// ROTATION EVERY 5 MINUTES
setInterval(() => {
  index = (index + 1) % data.length;

  popup.style.opacity = 0;

  setTimeout(() => {
    popup.textContent = data[index].text;
    popup.style.background = data[index].color;
    popup.style.opacity = 1;
  }, 400);

}, 300000); // 5 minutes
</script>

</body>
</html>
